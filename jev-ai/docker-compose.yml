services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: jev_user
      POSTGRES_PASSWORD: jev_pass
      POSTGRES_DB: jev_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jev_user -d jev_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.47.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  jev-ai:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://jev_user:jev_pass@postgres:5432/jev_ai
      MCP_POLYMARKET_URL: http://host.docker.internal:8081
      MCP_TELEGRAM_URL: http://host.docker.internal:8082
      POSITION_SIZE_USDC: "50.0"
      MAX_POSITIONS: "10"
      COPY_SELLS: "true"
      POLL_INTERVAL_SECS: "60"
      MIN_TRADES_90D: "20"
      MIN_LIFETIME_PNL: "10000.0"
      MIN_WIN_RATE: "0.20"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    ports:
      - "9091:9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
