apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jev-ai.fullname" . }}-config
data:
  GAMMA_API_URL: "https://gamma-api.polymarket.com"
  GAMMA_REQUIRES_AUTH: "false"
  MIN_TRADES_90D: {{ .Values.jevAi.env.minTrades90d | quote }}
  MIN_LIFETIME_PNL: {{ .Values.jevAi.env.minLifetimePnl | quote }}
  MIN_WIN_RATE: {{ .Values.jevAi.env.minWinRate | quote }}
  MAX_POSITIONS: {{ .Values.jevAi.env.maxPositions | quote }}
  POSITION_SIZE_USDC: {{ .Values.jevAi.env.positionSizeUsdc | quote }}
  COPY_SELLS: {{ .Values.jevAi.env.copySells | quote }}
  POLL_INTERVAL_SECS: {{ .Values.jevAi.env.pollIntervalSecs | quote }}
  MCP_POLYMARKET_URL: "http://{{ include \"jev-ai.fullname\" . }}-mcp-polymarket:{{ .Values.mcpPolymarket.service.port }}"
  MCP_TELEGRAM_URL: "http://{{ include \"jev-ai.fullname\" . }}-mcp-telegram:{{ .Values.mcpTelegram.service.port }}"
