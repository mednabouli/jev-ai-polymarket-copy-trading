{{- $secret := default (printf "%s-secrets" (include "jev-ai.fullname" .)) .Values.jevAi.secrets.existingSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jev-ai.fullname" . }}
  labels: {{- include "jev-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.jevAi.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/component: orchestrator, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: orchestrator, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: jev-ai
          image: "{{ .Values.jevAi.image.repository }}:{{ .Values.jevAi.image.tag }}"
          imagePullPolicy: {{ .Values.jevAi.image.pullPolicy }}
          envFrom:
            - configMapRef: {name: {{ include "jev-ai.fullname" . }}-config}
            - secretRef: {name: {{ $secret }}}
          resources: {{- toYaml .Values.jevAi.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jev-ai.fullname" . }}-mcp-polymarket
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: mcp-polymarket, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: mcp-polymarket, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: mcp-polymarket
          image: "{{ .Values.mcpPolymarket.image.repository }}:{{ .Values.mcpPolymarket.image.tag }}"
          ports: [{name: http, containerPort: {{ .Values.mcpPolymarket.service.port }}}]
          envFrom: [{configMapRef: {name: {{ include "jev-ai.fullname" . }}-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jev-ai.fullname" . }}-mcp-polymarket
spec:
  ports: [{name: http, port: {{ .Values.mcpPolymarket.service.port }}, targetPort: http}]
  selector: {app.kubernetes.io/component: mcp-polymarket, app.kubernetes.io/instance: {{ .Release.Name }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jev-ai.fullname" . }}-mcp-telegram
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: mcp-telegram, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: mcp-telegram, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: mcp-telegram
          image: "{{ .Values.mcpTelegram.image.repository }}:{{ .Values.mcpTelegram.image.tag }}"
          ports: [{name: http, containerPort: {{ .Values.mcpTelegram.service.port }}}]
          envFrom:
            - configMapRef: {name: {{ include "jev-ai.fullname" . }}-config}
            - secretRef: {name: {{ $secret }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jev-ai.fullname" . }}-mcp-telegram
spec:
  ports: [{name: http, port: {{ .Values.mcpTelegram.service.port }}, targetPort: http}]
  selector: {app.kubernetes.io/component: mcp-telegram, app.kubernetes.io/instance: {{ .Release.Name }}}
