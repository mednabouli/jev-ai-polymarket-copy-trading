{{- if not .Values.jevAi.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jev-ai.fullname" . }}-secrets
type: Opaque
stringData:
  CLAUDE_CODE_OAUTH_TOKEN: {{ required "Set jevAi.secrets.claudeCodeOauthToken" .Values.jevAi.secrets.claudeCodeOauthToken | quote }}
  TELEGRAM_BOT_TOKEN: {{ required "Set jevAi.secrets.telegramBotToken" .Values.jevAi.secrets.telegramBotToken | quote }}
  TELEGRAM_CHAT_ID: {{ required "Set jevAi.secrets.telegramChatId" .Values.jevAi.secrets.telegramChatId | quote }}
  POSTGRES_PASSWORD: {{ required "Set postgresql.password" .Values.postgresql.password | quote }}
{{- end }}
