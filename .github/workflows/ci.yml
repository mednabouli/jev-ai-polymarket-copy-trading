name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd jev-ai
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Debug - List files
        run: |
          cd jev-ai
          ls -la
          echo "---"
          cat requirements.txt

      - name: Run tests
        run: |
          cd jev-ai
          pytest tests/ -v --tb=long

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd jev-ai
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug - Python path
        run: |
          cd jev-ai
          python --version
          pip list
          echo "---"
          python -c "import sys; print(sys.path)"

      - name: Check imports
        run: |
          cd jev-ai
          python -c "import main; print('main OK')"
          python -c "import config; print('config OK')"
          python -c "import wallet_tracker; print('wallet_tracker OK')"
          python -c "import copy_executor; print('copy_executor OK')"
          python -c "import telegram_handler; print('telegram_handler OK')"
          python -c "import database; print('database OK')"
          python -c "import metrics; print('metrics OK')"
